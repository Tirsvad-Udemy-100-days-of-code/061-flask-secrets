[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-secrets"
version = "0.1.0"
description = "Day 61 of 100 Days of Code: a Flask site with a Flask-WTF login form that guards a secret page."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "Flask",
    "Flask-WTF",
    "email-validator",
    "Bootstrap-Flask",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flask_secrets = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
