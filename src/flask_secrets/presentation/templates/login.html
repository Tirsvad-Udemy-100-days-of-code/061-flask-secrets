<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form action="/login" method="post">
        {{ form.csrf_token }}
        {{ form.email.label }} {{ form.email(size=input_size) }}
        {{ form.password.label }} {{ form.password(size=input_size) }}
        <input type="submit" value="Log In">
    </form>
</body>
</html>
